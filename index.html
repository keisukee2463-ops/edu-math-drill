<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ゆっくり・すっきり さんすうプリント</title>
  <style>
    :root {
      --bg-app: #f6f5f2;
      --bg-panel: #ffffff;
      --bg-subtle: #efede8;
      --text-main: #1c1917;
      --text-sub: #57534e;
      --text-muted: #a8a29e;
      --border-soft: #e7e5e4;
      --border-mid: #d6d3d1;
      --accent: #2c5e4f;
      --accent-soft: #eaf2ef;
      --ink: #18181b;
      --trace-gray: #c8c8d0;
      --ans-red: #c2410c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "UD Digi Kyokasho N-R", "UD Digi Kyokasho NP-R", "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", sans-serif;
      background: var(--bg-app);
      color: var(--text-main);
      display: flex;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ====== 左サイドバー（上品な文具・エディトリアル調） ====== */
    .sidebar {
      width: 300px;
      background: var(--bg-panel);
      border-right: 1px solid var(--border-soft);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 40;
      overflow-y: auto;
    }

    .brand-box {
      padding: 20px 18px 16px;
      border-bottom: 1px solid var(--border-soft);
    }

    .brand-kicker {
      font-size: 0.68rem;
      color: var(--accent);
      font-weight: 700;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }

    .brand-main {
      font-size: 1.02rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: 0.02em;
      line-height: 1.35;
    }

    .brand-count {
      font-size: 0.72rem;
      color: var(--text-sub);
      margin-top: 4px;
      font-weight: 600;
    }

    .brand-note {
      font-size: 0.68rem;
      color: var(--text-sub);
      line-height: 1.55;
      margin-top: 10px;
      padding: 8px 10px;
      background: #fafaf9;
      border: 1px solid var(--border-soft);
      border-radius: 6px;
    }

    .brand-note p {
      margin: 0;
    }

    .brand-note p + p {
      margin-top: 4px;
    }

    .grade-filter {
      display: flex;
      gap: 4px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-soft);
      background: #fafaf9;
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .grade-chip {
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-sub);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 5px 9px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .grade-chip:hover {
      background: var(--bg-subtle);
    }

    .grade-chip.active {
      background: var(--text-main);
      color: #fff;
    }

    .unit-list {
      padding: 14px 12px 32px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      flex: 1;
    }

    .cat-group-title {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.05em;
      margin-bottom: 6px;
      padding-left: 6px;
      border-left: 3px solid var(--accent);
    }

    .unit-btn {
      width: 100%;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 7px;
      padding: 7px 9px;
      margin-bottom: 2px;
      cursor: pointer;
      transition: all 0.12s;
      display: flex;
      align-items: flex-start;
      gap: 7px;
    }

    .unit-btn:hover {
      background: #fafaf9;
      border-color: var(--border-soft);
    }

    .unit-btn.active {
      background: var(--accent-soft);
      border-color: #b7d4cb;
    }

    .unit-grade-tag {
      font-size: 0.64rem;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 4px;
      background: var(--bg-subtle);
      color: var(--text-sub);
      white-space: nowrap;
      margin-top: 1px;
    }

    .unit-btn.active .unit-grade-tag {
      background: var(--accent);
      color: #fff;
    }

    .unit-name {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.35;
    }

    /* ====== メインエリア ====== */
    .main-area {
      margin-left: 300px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .top-toolbar {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-soft);
      padding: 12px 28px;
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .toolbar-inner {
      max-width: 940px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .step-pills {
      display: inline-flex;
      background: var(--bg-subtle);
      padding: 3px;
      border-radius: 8px;
      gap: 2px;
    }

    .step-pill {
      border: none;
      background: transparent;
      padding: 6px 13px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-sub);
      cursor: pointer;
      transition: all 0.15s;
    }

    .step-pill.active {
      background: #fff;
      color: var(--text-main);
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .page-select {
      padding: 7px 11px;
      border: 1px solid var(--border-mid);
      border-radius: 7px;
      font-size: 0.81rem;
      font-weight: 700;
      background: #fff;
      color: var(--text-main);
      cursor: pointer;
    }

    .btn {
      padding: 7px 13px;
      border-radius: 7px;
      border: 1px solid var(--border-mid);
      background: #fff;
      color: var(--text-main);
      font-weight: 700;
      font-size: 0.81rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.12s;
    }

    .btn:hover {
      background: #fafaf9;
      border-color: #a8a29e;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-ans.active {
      background: #fff7ed;
      color: var(--ans-red);
      border-color: #fdba74;
    }

    .btn-print {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      padding: 7px 16px;
    }

    .btn-print:hover {
      background: #234b3f;
      border-color: #234b3f;
    }

    .btn-all-print {
      background: #0f766e;
      color: #fff;
      border-color: #0f766e;
      padding: 7px 16px;
    }

    .btn-all-print:hover {
      background: #115e59;
      border-color: #115e59;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--text-main);
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      display: none;
      z-index: 100;
    }

    /* ====== プレビュー背景エリア ====== */
    .preview-workspace {
      padding: 28px 24px 64px;
      flex: 1;
    }

    #sheetsContainer {
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    /* ====== A4 プリント紙面（出版教材レベルの端正な組版） ====== */
    .sheet {
      width: 210mm;
      min-height: 280mm;
      margin: 0 auto;
      background: #fff;
      padding: 11mm 15mm;
      box-shadow: 0 2px 12px rgba(28, 25, 23, 0.06), 0 0 1px rgba(28, 25, 23, 0.12);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1.5px solid var(--ink);
      padding-bottom: 6px;
      margin-bottom: 12px;
    }

    .sheet-title-wrap {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .sheet-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--ink);
    }

    .sheet-step-badge {
      display: inline-block;
      font-size: 0.74rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      background: #f4f4f5;
      color: #18181b;
      border: 1px solid #71717a;
      letter-spacing: 0.02em;
      vertical-align: middle;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .sheet-page-num {
      font-size: 0.8rem;
      color: #71717a;
      font-weight: 600;
    }

    .name-line {
      font-size: 0.94rem;
      border-bottom: 1px solid var(--ink);
      width: 195px;
      padding-bottom: 3px;
      color: var(--ink);
      letter-spacing: 0.05em;
    }

    /* ====== 問題グリッド ====== */
    .problems-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 32px;
      row-gap: 20px;
      align-content: start;
    }

    .problems-grid.rows-4 {
      row-gap: 15px;
      column-gap: 32px;
    }

    .problems-grid.single-col {
      grid-template-columns: 1fr;
      row-gap: 14px;
    }

    .problem-item {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      position: relative;
      padding: 0;
    }

    .p-num {
      font-size: 0.90rem;
      font-weight: 700;
      margin-bottom: 5px;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .rei-badge {
      border: 1.2px solid var(--ink);
      border-radius: 4px;
      padding: 0px 7px;
      font-size: 0.74rem;
      letter-spacing: 0.05em;
    }

    /* なぞり文字と解答表示 */
    .trace {
      color: var(--trace-gray);
      font-weight: 700;
    }

    .ans-red {
      color: var(--ans-red);
      font-weight: 700;
    }

    /* 記入マス（子どもの鉛筆での書きやすさ・文字収まり最適化） */
    .box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 46px;
      height: 38px;
      min-width: 46px;
      border: 1.4px solid var(--ink);
      border-radius: 4px;
      font-size: 1.25rem;
      font-weight: 700;
      background: #fff;
      vertical-align: middle;
      box-sizing: border-box;
      white-space: nowrap;
      line-height: 1;
    }

    .box.dotted {
      border: 1.4px dashed #71717a;
    }

    /* 1〜2桁の数字・時間・単位用 */
    .box.sm {
      width: 40px;
      height: 34px;
      min-width: 40px;
      font-size: 1.15rem;
    }

    /* 分数スタック用（分子・分母専用） */
    .box.frac {
      width: 36px;
      height: 30px;
      min-width: 36px;
      font-size: 1.08rem;
    }

    /* 極小マス（記号や1文字のみ） */
    .box.xs {
      width: 32px;
      height: 28px;
      min-width: 32px;
      font-size: 0.98rem;
    }

    /* 3桁の数字用（200, 500, 800等） */
    .box.md {
      width: 54px;
      height: 38px;
      min-width: 54px;
      font-size: 1.22rem;
    }

    /* 3〜4桁の数字・短い単語用（1000, 1200, ドッジ, きょり等） */
    .box.wide {
      width: 66px;
      height: 38px;
      min-width: 66px;
      font-size: 1.15rem;
    }

    /* 4〜5桁の数字・単語用 */
    .box.xwide {
      width: 86px;
      height: 38px;
      min-width: 86px;
      font-size: 1.15rem;
    }

    /* 日本語文・長文選択肢専用（「直角より 大きい」等） */
    .box.text {
      width: 156px;
      height: 38px;
      min-width: 156px;
      font-size: 0.92rem;
      padding: 0 6px;
    }

    /* 時計ペアレイアウト */
    .clock-pair-row {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 54px 1fr 172px;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid #e4e4e7;
      padding-bottom: 8px;
    }

    .clock-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .clock-time-boxes {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 1rem;
      font-weight: 700;
    }

    .arrow-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-bottom: 18px;
      gap: 2px;
    }

    .arrow-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: #3f3f46;
      white-space: nowrap;
    }

    .duration-ans-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      border-left: 1px dashed #d4d4d8;
      padding: 4px 0 4px 10px;
    }

    .duration-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: #3f3f46;
      letter-spacing: 0.03em;
    }

    .duration-main {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 1.04rem;
      font-weight: 700;
    }

    .duration-sub-hint {
      font-size: 0.84rem;
      font-weight: 700;
      color: #52525b;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .single-clock-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      width: 100%;
      padding: 2px 0;
    }

    /* 筆算テーブル（くり上がり・くり下がり補助枠対応） */
    .hissan-table {
      border-collapse: collapse;
      margin-left: 10px;
    }
    .hissan-table td {
      width: 52px;
      height: 44px;
      border: 1.2px dashed #a1a1aa;
      text-align: center;
      vertical-align: middle;
      font-size: 1.7rem;
      font-weight: 700;
      position: relative;
    }
    .hissan-table tr.line-bottom td {
      border-bottom: 2.2px solid var(--ink);
    }
    .hissan-table td.op {
      border: none;
      width: 32px;
      font-size: 1.5rem;
    }
    .place-label td {
      height: 18px;
      font-size: 0.64rem;
      color: #71717a;
      border: none;
      padding-bottom: 2px;
      white-space: nowrap;
      letter-spacing: -0.3px;
      line-height: 1;
    }
    .helper-row td {
      height: 30px;
      border: none;
      padding: 2px 0;
      vertical-align: middle;
    }
    .carry-circle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1.3px dashed #71717a;
      font-size: 1.0rem;
      font-weight: 700;
      background: #fff;
    }
    .borrow-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }
    .borrow-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 27px;
      border: 1.3px dashed #71717a;
      border-radius: 3px;
      font-size: 0.95rem;
      font-weight: 700;
      background: #fff;
    }
    .slashed-digit {
      position: relative;
      display: inline-block;
    }
    .slashed-digit.active::after {
      content: "";
      position: absolute;
      left: -4px;
      right: -4px;
      top: 48%;
      border-top: 2px solid #52525b;
      transform: rotate(28deg);
    }

    /* 計算・図形・測定共通 */
    .sakuranbo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    .eq-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.55rem;
      font-weight: 700;
      flex-wrap: wrap;
    }
    .eq-row.md {
      font-size: 1.28rem;
      gap: 6px;
    }
    .eq-row.sm {
      font-size: 1.08rem;
      gap: 5px;
    }
    .branch-svg {
      width: 116px;
      height: 26px;
      margin: 2px 0;
    }
    .branch-boxes {
      display: flex;
      gap: 18px;
      align-items: center;
    }
    .div-scaffold {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding-left: 12px;
    }
    .div-sub-row {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 1.18rem;
      font-weight: 700;
      color: var(--ink);
      padding-left: 12px;
      border-left: 2px solid #d4d4d8;
    }
    .angle-row {
      display: flex;
      align-items: center;
      gap: 20px;
      width: 100%;
    }

    /* 九九・かけ算 */
    .kuku-card {
      border: 1px solid #e4e4e7;
      border-radius: 6px;
      padding: 8px 12px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .kuku-yomi {
      font-size: 0.8rem;
      font-weight: 700;
      color: #52525b;
      background: #f4f4f5;
      padding: 2px 8px;
      border-radius: 4px;
      display: inline-block;
      width: fit-content;
    }

    /* 位取り表 */
    .place-chart {
      border-collapse: collapse;
    }
    .place-chart th {
      border: 1.2px solid #52525b;
      background: #f4f4f5;
      font-size: 0.75rem;
      padding: 2px 8px;
      color: #27272a;
    }
    .place-chart td {
      border: 1.2px solid #52525b;
      width: 40px;
      height: 36px;
      text-align: center;
      font-size: 1.25rem;
      font-weight: 700;
    }

    /* 分数スタック */
    .frac-stack {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      vertical-align: middle;
      margin: 0 4px;
    }
    .frac-bar {
      width: 100%;
      height: 2px;
      background: var(--ink);
      margin: 3px 0;
    }

    /* 小数筆算用縦ライン */
    .dec-hissan-table {
      border-collapse: collapse;
      margin-left: 10px;
    }
    .dec-hissan-table td {
      width: 48px;
      height: 42px;
      border: 1.2px dashed #a1a1aa;
      text-align: center;
      vertical-align: middle;
      font-size: 1.6rem;
      font-weight: 700;
      position: relative;
    }
    .dec-hissan-table .place-label td {
      font-size: 0.58rem;
      letter-spacing: -0.5px;
      white-space: nowrap;
    }
    .dec-hissan-table td.dec-point-col {
      width: 14px;
      border: none;
      font-size: 1.8rem;
      color: #18181b;
      position: relative;
    }
    .dec-hissan-table td.dec-point-col.has-guide::after {
      content: "";
      position: absolute;
      left: 50%;
      top: -2px;
      bottom: -2px;
      border-left: 1.5px dashed #dc2626;
      opacity: 0.65;
    }
    .dec-hissan-table tr.line-bottom td {
      border-bottom: 2.2px solid var(--ink);
    }
    .dec-hissan-table td.op {
      border: none;
      width: 30px;
      font-size: 1.5rem;
    }

    /* 2けた×2けた 筆算段ずれテーブル */
    .mul2d-table {
      border-collapse: collapse;
      margin-left: 10px;
    }
    .mul2d-table td {
      width: 40px;
      height: 38px;
      border: 1.2px dashed #a1a1aa;
      text-align: center;
      vertical-align: middle;
      font-size: 1.5rem;
      font-weight: 700;
    }
    .mul2d-table tr.line-sub td {
      border-bottom: 1.6px solid var(--ink);
    }
    .mul2d-table tr.line-bottom td {
      border-bottom: 2.2px solid var(--ink);
    }
    .mul2d-table td.op {
      border: none;
      width: 26px;
      font-size: 1.3rem;
    }
    .mul2d-table td.blank {
      border: none;
      background: transparent;
    }

    /* クロス集計表 */
    .cross-table {
      border-collapse: collapse;
      width: 100%;
      max-width: 500px;
      margin: 8px auto;
    }
    .cross-table th, .cross-table td {
      border: 1.4px solid #3f3f46;
      text-align: center;
      padding: 6px 10px;
      font-size: 1.15rem;
      font-weight: 700;
    }
    .cross-table th {
      background: #f4f4f5;
      font-size: 0.95rem;
      color: #27272a;
    }
    .cross-table .total-cell {
      background: #fafafa;
    }

    @media screen and (max-width: 860px) {
      body {
        flex-direction: column;
      }
      .sidebar {
        position: relative;

    function initFromURL() {

      if (u && CATALOG.some(cat => cat.items.some(i => i.id === u))) {

    function drawClockSVG(hour, minute, opts = {}) {
      const size = opts.size || 148;
      const cx = 100;
      const cy = 100;
      const r = 73;
      const showOuter = opts.showOuterMin !== false;

      let arcSvg = '';
      if (opts.arcFromMin !== null && opts.arcFromMin !== undefined && opts.arcToMin !== null && opts.arcToMin !== undefined) {
        const startAng = (opts.arcFromMin * 6 - 90) * (Math.PI / 180);
        let diffMin = (opts.arcToMin - opts.arcFromMin + 60) % 60;
        if (diffMin === 0) diffMin = 60;
        const endAng = ((opts.arcFromMin + diffMin) * 6 - 90) * (Math.PI / 180);

        const x1 = cx + r * Math.cos(startAng);
        const y1 = cy + r * Math.sin(startAng);
        const x2 = cx + r * Math.cos(endAng);
        const y2 = cy + r * Math.sin(endAng);
        const largeArc = diffMin > 30 ? 1 : 0;

        arcSvg = `
          <path d="M ${cx} ${cy} L ${x1.toFixed(1)} ${y1.toFixed(1)} A ${r} ${r} 0 ${largeArc} 1 ${x2.toFixed(1)} ${y2.toFixed(1)} Z"
                fill="#e4e4e7" fill-opacity="0.7" />
          <path d="M ${x1.toFixed(1)} ${y1.toFixed(1)} A ${r} ${r} 0 ${largeArc} 1 ${x2.toFixed(1)} ${y2.toFixed(1)}"
                fill="none" stroke="#52525b" stroke-width="2.2" stroke-dasharray="3 2" />
        `;
      }

      let ticks = '';
      for (let m = 0; m < 60; m++) {
        const deg = m * 6 - 90;
        const rad = (deg * Math.PI) / 180;
        const isFive = m % 5 === 0;
        const rInner = isFive ? r - 6.5 : r - 3.5;
        const x1 = cx + rInner * Math.cos(rad);
        const y1 = cy + rInner * Math.sin(rad);
        const x2 = cx + r * Math.cos(rad);
        const y2 = cy + r * Math.sin(rad);
        ticks += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#18181b" stroke-width="${isFive ? 2 : 0.9}" />`;
      }

      let nums = '';
      for (let h = 1; h <= 12; h++) {
        const deg = h * 30 - 90;
        const rad = (deg * Math.PI) / 180;
        const rNum = r - 17.5;
        const nx = cx + rNum * Math.cos(rad);
        const ny = cy + rNum * Math.sin(rad);
        nums += `<text x="${nx.toFixed(1)}" y="${ny.toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="700" fill="#18181b">${h}</text>`;

        if (showOuter) {
          const minVal = (h * 5) % 60;
          const minLabel = minVal === 0 ? '0' : String(minVal);
          const rOuter = r + 12.5;
          const ox = cx + rOuter * Math.cos(rad);
          const oy = cy + rOuter * Math.sin(rad);
          nums += `<text x="${ox.toFixed(1)}" y="${oy.toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#71717a">${minLabel}</text>`;
        }
      }

      let handsSvg = '';
      if (opts.hideHands) {
        handsSvg = `<circle cx="${cx}" cy="${cy}" r="4" fill="#18181b" />`;
      } else {
        const minDeg = minute * 6 - 90;
        const minRad = (minDeg * Math.PI) / 180;
        const mx = cx + (r - 5) * Math.cos(minRad);
        const my = cy + (r - 5) * Math.sin(minRad);

        const hourDeg = ((hour % 12) + minute / 60) * 30 - 90;
        const hourRad = (hourDeg * Math.PI) / 180;
        const hx = cx + (r - 28) * Math.cos(hourRad);
        const hy = cy + (r - 28) * Math.sin(hourRad);

        const strokeColor = opts.traceHands ? '#a1a1aa' : '#18181b';
        handsSvg = `
          <line x1="${cx}" y1="${cy}" x2="${hx.toFixed(1)}" y2="${hy.toFixed(1)}" stroke="${strokeColor}" stroke-width="5" stroke-linecap="round" />
          <line x1="${cx}" y1="${cy}" x2="${mx.toFixed(1)}" y2="${my.toFixed(1)}" stroke="${strokeColor}" stroke-width="2.6" stroke-linecap="round" />
          <circle cx="${cx}" cy="${cy}" r="4" fill="${strokeColor}" />
        `;
      }

      return `
        <svg width="${size}" height="${size}" viewBox="0 0 200 200">
          <circle cx="${cx}" cy="${cy}" r="${r}" fill="#ffffff" stroke="#18181b" stroke-width="2" />
          ${arcSvg}
          ${ticks}
          ${nums}
          ${handsSvg}
        </svg>
      `;
    }

    function buildSingleSheetHTML(unit, level, pageIdx, totalPages, overridePageLabel = null) {
      currentRenderingStep = level;
      const s = state.baseSeed + pageIdx * 101;
      const pageLabel = overridePageLabel !== null ? overridePageLabel : (totalPages > 1 ? `（${pageIdx + 1} / ${totalPages}）` : '');

      const g5Res = addG5Units(unit, level, s, pageLabel);
      if (g5Res) return g5Res;
      const g6Res = addG6Units(unit, level, s, pageLabel);
      if (g6Res) return g6Res;

      // ====== 1. とけい（時刻と時間） ======
      if (unit === 'clock_diff_same') {
        const pairs = [{ h1: 3, m1: 10, h2: 3, m2: 30, diff: 20, isRei: true }];
        for (let i = 1; i <= 3; i++) {
          const h = ((s + i * 3) % 11) + 1;
          const m1Step = ((s + i * 2) % 7) + 1;
          const maxDiff = Math.max(2, 11 - m1Step);
          const diffStep = ((s + i * 3) % (maxDiff - 1)) + 2;
          const m1 = m1Step * 5;
          const diff = diffStep * 5;
          const m2 = m1 + diff;
          pairs.push({ h1: h, m1, h2: h, m2, diff, isRei: false });
        }
        return buildClockDiffSheetHTML('とけい（なんじなんぷん・あと なんぷんかん①）', pageLabel, pairs, level, false);
      }

      if (unit === 'clock_diff_to_hour') {
        const pairs = [{ h1: 11, m1: 55, h2: 12, m2: 0, diff: 5, isRei: true }];
        const minCandidates = [50, 45, 40, 35, 30, 55, 25];
        for (let i = 1; i <= 3; i++) {
          const h1 = ((s + i * 3) % 11) + 1;
          const h2 = h1 === 12 ? 1 : h1 + 1;
          const m1 = minCandidates[(s + i * 2) % minCandidates.length];
          const diff = 60 - m1;
          pairs.push({ h1, m1, h2, m2: 0, diff, isRei: false });
        }
        return buildClockDiffSheetHTML('とけい（ちょうど まで あと なんぷんかん②）', pageLabel, pairs, level, false);
      }

      if (unit === 'clock_diff_cross') {
        const pairs = [{ h1: 9, m1: 50, h2: 10, m2: 10, diff: 20, isRei: true }];
        const startMins = [45, 50, 55, 40, 35];
        const endMins = [5, 10, 15, 20, 25];
        for (let i = 1; i <= 3; i++) {
          const h1 = ((s + i * 3) % 11) + 1;

            return `
              <div class="problem-item" style="border:1px solid #e4e4e7; border-radius:6px; padding:12px; width:100%;">

            <div class="problem-item" style="border:1px solid #e4e4e7; border-radius:6px; padding:12px; width:100%;">

      }

      if (unit === 'num_10000_place') {
        const title = '10000までの 数（千・百・十・一の くらい）';
        const list = [
          { th: 2, h: 4, t: 0, o: 6, isRei: true },

          const val = it.th * 1000 + it.h * 100 + it.t * 10 + it.o;

          const showZeroHint = (it.isRei || level === 'step1' || level === 'step2') && (it.h === 0 || it.t === 0);
          const parts = [];
          if (it.th > 0) parts.push(`1000が ${it.th}こ`);
          if (it.h > 0) parts.push(`100が ${it.h}こ`);
          if (it.t > 0) parts.push(`10が ${it.t}こ`);
          if (it.o > 0) parts.push(`1が ${it.o}こ`);

          return `
            <div class="problem-item" style="border-bottom:1px solid #e4e4e7; width:100%; padding-bottom:10px;">
              <div class="p-num">
                ${it.isRei ? '<span class="rei-badge">れい</span>' : `(${idx})`}

              <div style="display:flex; align-items:center; justify-content:space-between; width:100%; gap:12px;">
                <div style="font-size:1.05rem; font-weight:700;">${parts.join('、')} あわせた 数</div>
                <div style="display:flex; align-items:center; gap:10px;">
                  <table class="place-chart">
                    <tr><th>千</th><th>百</th><th>十</th><th>一</th></tr>
                    <tr>
                      <td>${cellVal(it.th, traceChart)}</td>

        }).join('');
        return wrapSheet(title, pageLabel, 'problems-grid single-col', itemsHtml);
      }

      if (unit === 'frac_basic') {
        const title = 'ぶんすう（おなじ 大きさに わけた 数）';
        const combos = [
          { denom: 2, shape: 'circle' },
          { denom: 4, shape: 'bar' },
          { denom: 8, shape: 'circle' },
          { denom: 2, shape: 'bar' },
          { denom: 8, shape: 'bar' },
          { denom: 4, shape: 'circle' }
        ];
        const list = [{ denom: 4, shape: 'circle', isRei: true }];
        for (let i = 1; i <= 5; i++) {
          list.push({ ...combos[(s + i - 1) % combos.length], isRei: false });
        }
        const itemsHtml = list.map((it, idx) => {
          const traceNum = it.isRei || level === 'step1';
          const showCountHint = it.isRei || level === 'step1' || level === 'step2';
          let svgShape = '';
          if (it.shape === 'circle') {
            const r = 38, cx = 48, cy = 44;
            const endAng = (360 / it.denom - 90) * Math.PI / 180;
            const x2 = cx + r * Math.cos(endAng);
            const y2 = cy + r * Math.sin(endAng);
            let lines = '';
            for (let k = 0; k < it.denom; k++) {
              const a = (k * 360 / it.denom - 90) * Math.PI / 180;
              lines += `<line x1="${cx}" y1="${cy}" x2="${(cx + r * Math.cos(a)).toFixed(1)}" y2="${(cy + r * Math.sin(a)).toFixed(1)}" stroke="#18181b" stroke-width="1.6" />`;
            }
            const wedge = it.denom === 2
              ? `<path d="M ${cx} ${cy - r} A ${r} ${r} 0 0 1 ${cx} ${cy + r} Z" fill="#d4d4d8" />`
              : `<path d="M ${cx} ${cy} L ${cx} ${cy - r} A ${r} ${r} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)} Z" fill="#d4d4d8" />`;
            svgShape = `<svg width="96" height="88" viewBox="0 0 96 88"><circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" stroke="#18181b" stroke-width="1.8" />${wedge}<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#18181b" stroke-width="1.8" />${lines}</svg>`;
          } else {
            const w = 88, h = 36, x0 = 4, y0 = 26;
            const partW = w / it.denom;
            let divs = '';
            for (let k = 1; k < it.denom; k++) {
              divs += `<line x1="${(x0 + k * partW).toFixed(1)}" y1="${y0}" x2="${(x0 + k * partW).toFixed(1)}" y2="${y0 + h}" stroke="#18181b" stroke-width="1.5" />`;
            }
            svgShape = `<svg width="96" height="88" viewBox="0 0 96 88"><rect x="${x0}" y="${y0}" width="${partW.toFixed(1)}" height="${h}" fill="#d4d4d8" /><rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="none" stroke="#18181b" stroke-width="1.8" />${divs}</svg>`;

          return `
            <div class="problem-item" style="border:1px solid #e4e4e7; border-radius:6px; padding:8px 10px; width:100%;">
              <div class="p-num">${it.isRei ? '<span class="rei-badge">れい</span>' : `(${idx})`}</div>

      }

      // ====== 6. ながさ・かさ（測定） ======
      if (unit === 'len_ruler') {
        const title = 'ながさ①（ものさしを よもう cm・mm）';
        const list = [
          { cm: 4, mm: 5, isRei: true },

        const itemsHtml = list.map((it, idx) => {

            const isCm = m % 10 === 0;
            const is5 = m % 5 === 0;
            const tickH = isCm ? 16 : is5 ? 11 : 6;
            rulerTicks += `<line x1="${x.toFixed(1)}" y1="30" x2="${x.toFixed(1)}" y2="${30 + tickH}" stroke="#18181b" stroke-width="${isCm ? 1.6 : 0.9}" />`;
            if (isCm) {
              rulerTicks += `<text x="${x.toFixed(1)}" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#18181b">${m / 10}</text>`;
            }
          }
          const traceCm = it.isRei || level === 'step1';
          const showGuideLine = it.isRei || level === 'step1' || level === 'step2';
          return `
            <div class="problem-item" style="border-bottom:1px solid #e4e4e7; width:100%; padding-bottom:10px;">
              <div class="p-num">${it.isRei ? '<span class="rei-badge">れい</span>' : `(${idx})`}</div>
              <div style="display:flex; align-items:center; justify-content:space-between; width:100%; gap:12px;">
                <svg width="340" height="68" viewBox="0 0 340 68">
                  <rect x="${xStart}" y="8" width="${barW.toFixed(1)}" height="16" fill="#d4d4d8" stroke="#18181b" stroke-width="1.5" />
                  ${showGuideLine ? `<line x1="${(xStart + barW).toFixed(1)}" y1="8" x2="${(xStart + barW).toFixed(1)}" y2="46" stroke="#52525b" stroke-width="1.5" stroke-dasharray="3 2" />` : ''}
                  <rect x="8" y="30" width="324" height="34" fill="#fafafa" stroke="#18181b" stroke-width="1.5" />
                  ${rulerTicks}
                </svg>
                <div class="eq-row sm">
                  <span class="box sm">${cellVal(it.cm, traceCm)}</span>
                  <span>cm</span>
                  <span class="box sm">${cellVal(it.mm, it.isRei)}</span>
                  <span>mm</span>
                  <span style="color:#71717a;">（＝</span>
                  <span class="box wide dotted">${cellVal(totalMm, it.isRei)}</span>
                  <span style="color:#71717a;">mm）</span>
                </div>
              </div>
            </div>
          `;
        }).join('');
        return wrapSheet(title, pageLabel, 'problems-grid single-col', itemsHtml);
      }

      if (unit === 'len_conv_calc') {
        const title = 'ながさ②（1cm＝10mm・ながさの けいさん）';
        const items = [
          { type: 'cm2mm', cm: 3, mm: 6, isRei: true },
          { type: 'cm2mm', cm: ((s + 1) % 7) + 2, mm: ((s + 2) % 8) + 1, isRei: false },
          { type: 'mm2cm', cm: ((s + 3) % 7) + 2, mm: ((s + 4) % 8) + 1, isRei: false },
          { type: 'mm2cm', cm: ((s + 5) % 6) + 3, mm: ((s + 6) % 8) + 1, isRei: false },
          { type: 'add', c1: ((s + 1) % 4) + 2, m1: ((s + 2) % 4) + 1, c2: ((s + 3) % 3) + 1, m2: ((s + 4) % 4) + 1, isRei: false },
          { type: 'sub', c1: ((s + 2) % 4) + 5, m1: ((s + 3) % 4) + 5, c2: ((s + 1) % 3) + 1, m2: ((s + 4) % 4) + 1, isRei: false }
        ];
        if (items[2].cm === items[3].cm && items[2].mm === items[3].mm) items[3].cm += 1;
        const itemsHtml = items.map((it, idx) => {
          const showHelper = it.isRei || level === 'step1' || level === 'step2';
          const traceSub = it.isRei || level === 'step1';
          if (it.type === 'cm2mm') {
            return `
              <div class="problem-item" style="border:1px solid #e4e4e7; border-radius:6px; padding:12px; width:100%;">
                <div class="p-num">${it.isRei ? '<span class="rei-badge">れい</span>' : `(${idx})`}</div>
                <div class="eq-row sm">
                  <span>${it.cm}cm ${it.mm}mm ＝</span>
                  <span class="box wide">${cellVal(it.cm * 10 + it.mm, it.isRei)}</span>
                  <span>mm</span>
                </div>
                ${showHelper ? `
                  <div class="duration-sub-hint" style="margin-top:6px;">
                    <span>${it.cm}cm ＝</span>
                    <span class="box sm dotted">${cellVal(it.cm * 10, traceSub)}</span>
                    <span>mm だから、${it.cm * 10} ＋ ${it.mm}</span>

          }
          if (it.type === 'mm2cm') {
            return `
              <div class="problem-item" style="border:1px solid #e4e4e7; border-radius:6px; padding:12px; width:100%;">

            <div class="problem-item" style="border:1px solid #e4e4e7; border-radius:6px; padding:12px; width:100%;">

      if (unit === 'vol_measure') {
        const title = 'かさ①（ますを よもう L・dL）';
        const list = [
          { l: 1, dl: 4, isRei: true },
          { l: ((s + 1) % 2) + 1, dl: ((s + 2) % 7) + 2, isRei: false },

          for (let t = 1; t < 10; t++) {

          return `
            <div class="problem-item" style="border-bottom:1px solid #e4e4e7; width:100%; padding-bottom:10px;">

              <div style="display:flex; align-items:center; justify-content:space-between; width:100%; gap:12px;">
                <svg width="240" height="70" viewBox="0 0 240 70">${beakers}</svg>
                <div class="eq-row sm">
                  <span class="box sm">${cellVal(it.l, traceL)}</span>
                  <span>L</span>
                  <span class="box sm">${cellVal(it.dl, it.isRei)}</span>
                  <span>dL</span>
                  <span style="color:#71717a;">（＝</span>
                  <span class="box wide dotted">${cellVal(totalDl, it.isRei)}</span>
                  <span style="color:#71717a;">dL）</span>
                </div>
              </div>
            </div>
          `;
        }).join('');
        return wrapSheet(title, pageLabel, 'problems-grid single-col', itemsHtml);
      }

      if (unit === 'vol_conv_calc') {
        const title = 'かさ②（1L＝10dL・かさの けいさん）';
        const items = [
          { type: 'l2dl', l: 2, dl: 5, isRei: true },
          { type: 'l2dl', l: ((s + 1) % 6) + 1, dl: ((s + 2) % 8) + 1, isRei: false },
          { type: 'dl2l', l: ((s + 3) % 7) + 1, dl: ((s + 4) % 8) + 1, isRei: false },
          { type: 'dl2l', l: ((s + 5) % 6) + 2, dl: ((s + 6) % 8) + 1, isRei: false },
          { type: 'add', l1: ((s + 1) % 4) + 1, d1: ((s + 2) % 4) + 1, l2: ((s + 3) % 3) + 1, d2: ((s + 4) % 4) + 1, isRei: false },
          { type: 'sub', l1: ((s + 2) % 4) + 4, d1: ((s + 3) % 4) + 5, l2: ((s + 1) % 3) + 1, d2: ((s + 4) % 4) + 1, isRei: false }
        ];
        if (items[2].l === items[3].l && items[2].dl === items[3].dl) items[3].l += 1;
        const itemsHtml = items.map((it, idx) => {
          const showHelper = it.isRei || level === 'step1' || level === 'step2';
          const traceSub = it.isRei || level === 'step1';
          if (it.type === 'l2dl') {
            return `
              <div class="problem-item" style="border:1px solid #e4e4e7; border-radius:6px; padding:12px; width:100%;">
                <div class="p-num">${it.isRei ? '<span class="rei-badge">れい</span>' : `(${idx})`}</div>
                <div class="eq-row sm">
                  <span>${it.l}L ${it.dl}dL ＝</span>
                  <span class="box wide">${cellVal(it.l * 10 + it.dl, it.isRei)}</span>
                  <span>dL</span>

                ${showHelper ? `
                  <div class="duration-sub-hint" style="margin-top:6px;">
                    <span>${it.l}L ＝</span>
                    <span class="box sm dotted">${cellVal(it.l * 10, traceSub)}</span>
                    <span>dL だから、${it.l * 10} ＋ ${it.dl}</span>
                  </div>
                ` : ''}
              </div>
            `;
          }
          if (it.type === 'dl2l') {
            return `
              <div class="problem-item" style="border:1px solid #e4e4e7; border-radius:6px; padding:12px; width:100%;">

                  <span>${it.l * 10 + it.dl}dL ＝</span>

                  <span class="box sm">${cellVal(it.dl, false)}</span>
                  <span>dL</span>
                </div>
              </div>
            `;
          }
          const isAdd = it.type === 'add';
          const ansL = isAdd ? it.l1 + it.l2 : it.l1 - it.l2;

          return `
            <div class="problem-item" style="border:1px solid #e4e4e7; border-radius:6px; padding:12px; width:100%;">

        }).join('');
        return wrapSheet(title, pageLabel, 'problems-grid', itemsHtml);
      }

      // ====== 7. 図形・ひょうとグラフ ======
      if (unit === 'shape_tri_quad') {
        const title = 'さんかくけいと しかくけい（へん・ちょうてん）';
        const shapes = [
          { n: 3, pts: [[45, 12], [12, 74], [82, 70]] },
          { n: 4, pts: [[18, 16], [78, 14], [84, 72], [14, 74]] },

      // 13. 小数の ひき算（筆算・くり下がり）

      // 14. 分数の いみ（1/d がいくつ分か）

      // 19. 角の 大きさ（直角と くらべよう）

      }

      // ====== 8. 1年・3年・4年 追加単元群 ======

      // 【1年①】10までの かず・いくつと いくつ（10の 合成・分解）
      if (unit === 'g1_num_10') {
        const title = '10までの かず・いくつと いくつ（10をつくる）';
        const cand = [2, 4, 6, 7, 1, 8, 5, 9];
        const list = [{ a: 3, isRei: true }];
        for (let i = 1; i <= 3; i++) {
          list.push({ a: cand[(s + i) % cand.length], isRei: false });
        }
        const itemsHtml = list.map((it, idx) => {
          const b = 10 - it.a;
          const traceA = it.isRei || level === 'step1';
          const traceB = it.isRei;
          const showEmptyCircles = it.isRei || level !== 'step3';
          let frameCells = '';
          for (let k = 0; k < 10; k++) {
            const col = k % 5;
            const row = Math.floor(k / 5);
            const x = 6 + col * 28;
            const y = 6 + row * 28;
            const isFilled = k < it.a;
            frameCells += `<rect x="${x}" y="${y}" width="28" height="28" fill="#fff" stroke="#18181b" stroke-width="1.5" />`;
            if (isFilled) {
              frameCells += `<circle cx="${x + 14}" cy="${y + 14}" r="9" fill="#27272a" />`;
            } else if (showEmptyCircles) {
              frameCells += `<circle cx="${x + 14}" cy="${y + 14}" r="8.5" fill="none" stroke="#a1a1aa" stroke-width="1.3" stroke-dasharray="2.5 2" />`;
            }
          }
          return `
            <div class="problem-item" style="border-bottom:1.2px solid #e4e4e7; width:100%; padding-bottom:11px;">
              <div class="p-num">${it.isRei ? '<span class="rei-badge">れい</span>' : `(${idx})`}</div>
              <div style="display:flex; align-items:center; justify-content:space-between; width:100%; gap:14px;">
                <svg width="152" height="68" viewBox="0 0 152 68" style="flex-shrink:0;">
                  ${frameCells}
                </svg>
                <div class="eq-row md">
                  <span>10 は</span>
                  <span class="box sm">${cellVal(it.a, traceA)}</span>
                  <span>と</span>
                  <span class="box sm">${cellVal(b, traceB)}</span>
                </div>
              </div>
            </div>
          `;
        }).join('');
        return wrapSheet(title, pageLabel, 'problems-grid single-col', itemsHtml);
      }

      // 【1年②】なんばんめ（まえから ○ばんめ・○にん）
      if (unit === 'g1_order') {
        const title = 'なんばんめ（まえから ○ばんめ・まえから ○こ）';
        const cand = [
          { pos: 4, cnt: 3 }, { pos: 2, cnt: 5 }, { pos: 5, cnt: 2 },
          { pos: 6, cnt: 4 }, { pos: 3, cnt: 6 }, { pos: 7, cnt: 3 }
        ];
        const list = [{ pos: 3, cnt: 4, isRei: true }];
        for (let i = 1; i <= 3; i++) {
          list.push({ ...cand[(s + i) % cand.length], isRei: false });
        }
        const itemsHtml = list.map((it, idx) => {
          const tracePos = it.isRei || level === 'step1';
          const traceCnt = it.isRei;
          const showNums = it.isRei || level !== 'step3';
          let itemsSvg = `<text x="16" y="29" font-size="10" font-weight="700" fill="#18181b" text-anchor="middle">まえ</text>`;
          for (let k = 1; k <= 7; k++) {
            const cx = 44 + (k - 1) * 30;
            const isTarget = k === it.pos;
            itemsSvg += `<circle cx="${cx}" cy="25" r="11" fill="${isTarget ? '#27272a' : '#fff'}" stroke="#18181b" stroke-width="1.8" />`;
            if (showNums) {

            }
          }
          return `
            <div class="problem-item" style="border-bottom:1.2px solid #e4e4e7; width:100%; padding-bottom:10px;">
              <div class="p-num">${it.isRei ? '<span class="rei-badge">れい</span>' : `(${idx})`}</div>
              <div style="display:flex; align-items:center; justify-content:space-between; width:100%; gap:12px; flex-wrap:wrap;">
                <svg width="246" height="54" viewBox="0 0 246 54" style="flex-shrink:0;">
                  ${itemsSvg}
                </svg>
                <div style="display:flex; flex-direction:column; gap:5px; font-size:0.95rem; font-weight:700;">
                  <div class="eq-row sm">
                    <span>● は まえから</span>
                    <span class="box sm">${cellVal(it.pos, tracePos)}</span>
                    <span>ばんめ</span>
                  </div>
                  <div class="eq-row sm">
                    <span>まえから ${it.cnt}こ は ぜんぶで</span>
                    <span class="box sm">${cellVal(it.cnt, traceCnt)}</span>
                    <span>こ</span>
                  </div>
                </div>
              </div>
            </div>
          `;
        }).join('');
        return wrapSheet(title, pageLabel, 'problems-grid single-col', itemsHtml);
      }

      // 【1年③】あわせて いくつ・ふえると いくつ（10までの たしざん）
      if (unit === 'g1_add_10') {
        const title = 'あわせて いくつ（10までの たしざん）';
        const cand = [
          { a: 4, b: 3 }, { a: 5, b: 2 }, { a: 3, b: 6 },
          { a: 2, b: 7 }, { a: 6, b: 4 }, { a: 5, b: 3 }, { a: 4, b: 5 }
        ];
        const list = [{ a: 3, b: 2, isRei: true }];
        for (let i = 1; i <= 3; i++) {
          list.push({ ...cand[(s + i) % cand.length], isRei: false });
        }
        const itemsHtml = list.map((it, idx) => {
          const sum = it.a + it.b;
          const tracePart = it.isRei || level === 'step1';
          const traceAns = it.isRei;
          const showGroupBox = it.isRei || level !== 'step3';
          let dotsSvg = '';
          for (let k = 0; k < it.a; k++) {
            dotsSvg += `<circle cx="${18 + k * 20}" cy="24" r="7.5" fill="#52525b" stroke="#18181b" stroke-width="1.4" />`;
          }
          const bStart = 18 + it.a * 20 + 22;
          for (let k = 0; k < it.b; k++) {
            dotsSvg += `<circle cx="${bStart + k * 20}" cy="24" r="7.5" fill="#d4d4d8" stroke="#18181b" stroke-width="1.4" />`;
          }
          const totalW = bStart + (it.b - 1) * 20 + 18;
          return `
            <div class="problem-item" style="border-bottom:1.2px solid #e4e4e7; width:100%; padding-bottom:10px;">
              <div class="p-num">${it.isRei ? '<span class="rei-badge">れい</span>' : `(${idx})`}</div>
              <div style="display:flex; align-items:center; justify-content:space-between; width:100%; gap:12px;">
                <svg width="240" height="48" viewBox="0 0 240 48" style="flex-shrink:0;">
                  ${showGroupBox ? `<rect x="4" y="6" width="${totalW}" height="36" rx="18" fill="none" stroke="#71717a" stroke-width="1.3" stroke-dasharray="3 2" />` : ''}
                  ${dotsSvg}
                </svg>
                <div class="eq-row md">
                  <span class="box sm">${cellVal(it.a, tracePart)}</span>
                  <span>＋</span>
                  <span class="box sm">${cellVal(it.b, tracePart)}</span>
                  <span>＝</span>
                  <span class="box sm">${cellVal(sum, traceAns)}</span>
                </div>
              </div>
            </div>
          `;
        }).join('');
        return wrapSheet(title, pageLabel, 'problems-grid single-col', itemsHtml);
      }

      // 【1年④】のこりは いくつ・ちがいは いくつ（10までの ひきざん）
      if (unit === 'g1_sub_10') {
        const title = 'のこりは いくつ（10までの ひきざん）';
        const cand = [
          { a: 7, b: 3 }, { a: 8, b: 5 }, { a: 9, b: 4 },
          { a: 6, b: 2 }, { a: 10, b: 3 }, { a: 8, b: 2 }, { a: 9, b: 6 }
        ];
        const list = [{ a: 5, b: 2, isRei: true }];
        for (let i = 1; i <= 3; i++) {
          list.push({ ...cand[(s + i) % cand.length], isRei: false });
        }
        const itemsHtml = list.map((it, idx) => {
          const diff = it.a - it.b;
          const tracePart = it.isRei || level === 'step1';
          const traceAns = it.isRei;
          const showSlash = it.isRei || level !== 'step3';
          let dotsSvg = '';
          for (let k = 0; k < it.a; k++) {
            const cx = 18 + k * 21;
            const isTaken = k >= diff;
            dotsSvg += `<circle cx="${cx}" cy="24" r="7.5" fill="${isTaken && showSlash ? '#f4f4f5' : '#d4d4d8'}" stroke="#18181b" stroke-width="1.4" />`;
            if (isTaken && showSlash) {
              dotsSvg += `<line x1="${cx - 7}" y1="17" x2="${cx + 7}" y2="31" stroke="#dc2626" stroke-width="1.8" />`;
            }
          }
          return `
            <div class="problem-item" style="border-bottom:1.2px solid #e4e4e7; width:100%; padding-bottom:10px;">
              <div class="p-num">${it.isRei ? '<span class="rei-badge">れい</span>' : `(${idx})`}</div>
              <div style="display:flex; align-items:center; justify-content:space-between; width:100%; gap:12px;">
                <svg width="230" height="48" viewBox="0 0 230 48" style="flex-shrink:0;">
                  ${dotsSvg}
                </svg>
                <div class="eq-row md">
                  <span class="box sm">${cellVal(it.a, tracePart)}</span>
                  <span>－</span>
                  <span class="box sm">${cellVal(it.b, tracePart)}</span>
                  <span>＝</span>
                  <span class="box sm">${cellVal(diff, traceAns)}</span>
                </div>
              </div>
            </div>
          `;
        }).join('');
        return wrapSheet(title, pageLabel, 'problems-grid single-col', itemsHtml);
      }

      // 【1年⑤】20より おおきい かず（10の まとまりと ばら）
      if (unit === 'g1_num_20_100') {
        const title = '20より おおきい かず（10の まとまりと ばら）';
        const cand = [
          { t: 3, o: 6 }, { t: 4, o: 2 }, { t: 5, o: 7 },
          { t: 2, o: 8 }, { t: 6, o: 3 }, { t: 4, o: 5 }, { t: 3, o: 9 }
        ];
        const list = [{ t: 2, o: 4, isRei: true }];
        for (let i = 1; i <= 3; i++) {
          list.push({ ...cand[(s + i) % cand.length], isRei: false });
        }
        const itemsHtml = list.map((it, idx) => {
          const num = it.t * 10 + it.o;
          const tracePart = it.isRei || level === 'step1';
          const traceAns = it.isRei;
          const showLabel = it.isRei || level !== 'step3';
          let barsSvg = '';
          for (let k = 0; k < it.t; k++) {
            const x = 8 + k * 24;
            barsSvg += `<rect x="${x}" y="6" width="18" height="44" fill="#d4d4d8" stroke="#18181b" stroke-width="1.5" />`;
            if (showLabel) {
              barsSvg += `<text x="${x + 9}" y="32" font-size="8.5" font-weight="700" text-anchor="middle" fill="#18181b">10</text>`;
            }
          }
          const startO = 8 + it.t * 24 + 8;
          for (let k = 0; k < it.o; k++) {
            const ox = startO + Math.floor(k / 5) * 14;
            const oy = 40 - (k % 5) * 8.5;
            barsSvg += `<rect x="${ox}" y="${oy}" width="10" height="7" fill="#fff" stroke="#18181b" stroke-width="1.2" />`;
          }
          return `
            <div class="problem-item" style="border-bottom:1.2px solid #e4e4e7; width:100%; padding-bottom:10px;">
              <div class="p-num">${it.isRei ? '<span class="rei-badge">れい</span>' : `(${idx})`}</div>
              <div style="display:flex; align-items:center; justify-content:space-between; width:100%; gap:10px; flex-wrap:wrap;">
                <svg width="200" height="56" viewBox="0 0 200 56" style="flex-shrink:0;">
                  ${barsSvg}
                </svg>
                <div class="eq-row sm">
                  <span>10が</span>
                  <span class="box xs">${cellVal(it.t, tracePart)}</span>
                  <span>こと 1が</span>
                  <span class="box xs">${cellVal(it.o, tracePart)}</span>
                  <span>こ で</span>
                  <span class="box sm">${cellVal(num, traceAns)}</span>
                </div>
              </div>
            </div>
          `;
        }).join('');
        return wrapSheet(title, pageLabel, 'problems-grid single-col', itemsHtml);
      }

      // 【1年⑥】くりあがりの ある たしざん（さくらんぼ 10をつくる）
      if (unit === 'g1_add_carry') {
        const title = 'くりあがりの ある たしざん（10を つくる）';
        const cand = [
          { a: 9, b: 4 }, { a: 8, b: 5 }, { a: 7, b: 6 }, { a: 9, b: 6 },
          { a: 8, b: 4 }, { a: 7, b: 5 }, { a: 6, b: 6 }, { a: 9, b: 7 }, { a: 8, b: 7 }
        ];
        const list = [{ a: 8, b: 3, isRei: true }];
        for (let i = 1; i <= 5; i++) {
          list.push({ ...cand[(s + i) % cand.length], isRei: false });
        }
        const itemsHtml = list.map((it, idx) => {
          const split1 = 10 - it.a;
          const split2 = it.b - split1;
          const sum = it.a + it.b;
          const traceSplit = it.isRei || level === 'step1';
          const traceAns = it.isRei;
          const showNote = it.isRei || level !== 'step3';
          return `
            <div class="problem-item" style="border:1px solid #e4e4e7; border-radius:6px; padding:10px 12px;">
              <div class="p-num">${it.isRei ? '<span class="rei-badge">れい</span>' : `(${idx})`}</div>

                <div class="eq-row">

                  <svg class="branch-svg" viewBox="0 0 120 28">

                </div>
              </div>
            </div>
          `;
        }).join('');
        return wrapSheet(title, pageLabel, 'problems-grid', itemsHtml);
      }

      // 【1年⑦】くりさがりの ある ひきざん（10から ひく）
      if (unit === 'g1_sub_borrow') {
        const title = 'くりさがりの ある ひきざん（10から ひく）';
        const cand = [
          { a: 12, b: 8 }, { a: 14, b: 6 }, { a: 11, b: 7 }, { a: 15, b: 8 },
          { a: 13, b: 5 }, { a: 16, b: 9 }, { a: 12, b: 7 }, { a: 14, b: 8 }, { a: 11, b: 6 }
        ];
        const list = [{ a: 13, b: 8, isRei: true }];
        for (let i = 1; i <= 5; i++) {
          list.push({ ...cand[(s + i) % cand.length], isRei: false });
        }
        const itemsHtml = list.map((it, idx) => {
          const ones = it.a - 10;
          const rem10 = 10 - it.b;
          const ans = it.a - it.b;
          const traceSplit = it.isRei || level === 'step1';
          const traceAns = it.isRei;
          const showStepNote = it.isRei || level !== 'step3';
          return `
            <div class="problem-item" style="border:1px solid #e4e4e7; border-radius:6px; padding:10px 12px;">
              <div class="p-num">${it.isRei ? '<span class="rei-badge">れい</span>' : `(${idx})`}</div>
              <div class="sakuranbo-wrap">
                <div class="eq-row">
                  <span>${it.a}</span><span>－</span><span>${it.b}</span><span>＝</span>
                  <span class="box">${cellVal(ans, traceAns)}</span>

                <div style="width:100%; display:flex; flex-direction:column; align-items:center; padding-right:70px;">
                  <svg class="branch-svg" viewBox="0 0 120 26">
                    <line x1="60" y1="2" x2="32" y2="24" stroke="#18181b" stroke-width="1.8" />
                    <line x1="60" y1="2" x2="88" y2="24" stroke="#18181b" stroke-width="1.8" />
                  </svg>
                  <div class="branch-boxes">
                    <span class="box sm dotted">${cellVal(10, traceSplit)}</span>
                    <span class="box sm dotted">${cellVal(ones, traceSplit)}</span>
                  </div>
                  ${showStepNote ? `<div style="font-size:0.75rem; color:#52525b; font-weight:700; margin-top:4px; white-space:nowrap;">10－${it.b}＝${rem10}、${rem10}＋${ones}</div>` : ''}
                </div>
              </div>
            </div>
          `;
        }).join('');
        return wrapSheet(title, pageLabel, 'problems-grid', itemsHtml);
      }

      // 【1年⑧】3つの かずの けいさん（じゅんばんに けいさん）
      if (unit === 'g1_3nums') {
        const title = '3つの かずの けいさん（まえから じゅんばんに）';
        const cand = [
          { a: 4, op1: '＋', b: 2, op2: '＋', c: 3 },
          { a: 9, op1: '－', b: 3, op2: '－', c: 2 },
          { a: 6, op1: '－', b: 2, op2: '＋', c: 4 },
          { a: 5, op1: '＋', b: 3, op2: '－', c: 4 },
          { a: 3, op1: '＋', b: 4, op2: '＋', c: 2 },

        ];
        const list = [{ a: 3, op1: '＋', b: 2, op2: '＋', c: 4, isRei: true }];
        for (let i = 1; i <= 5; i++) {
          list.push({ ...cand[(s + i) % cand.length], isRei: false });
        }
        const itemsHtml = list.map((it, idx) => {
          const mid = it.op1 === '＋' ? it.a + it.b : it.a - it.b;
          const ans = it.op2 === '＋' ? mid + it.c : mid - it.c;
          const traceMid = it.isRei || level === 'step1';
          const traceAns = it.isRei;
          const showBracket = it.isRei || level !== 'step3';
          return `
            <div class="problem-item" style="border:1px solid #e4e4e7; border-radius:6px; padding:10px 14px;">

              <div style="font-weight:700;">式：y ＝ <span class="box xs">${cellVal(it.k, tracePart)}</span> × x の 比例のグラフ</div>
              <div style="font-size:0.85rem; color:#52525b;">x＝${it.x1} のときの y の値は？</div>
            </div>
            <div class="eq-row" style="font-size:1.1rem; gap:8px;">
              <span>y ＝</span>
              <span class="box sm">${cellVal(it.y1, it.isRei)}</span>
            </div>
          </div>
          ${showHint ? `<div style="font-size:0.75rem; color:#71717a; text-align:right;">(グラフの縦軸を読む)</div>` : ''}
        </div>
      `;
    }).join('');
    return wrapSheet(title, pageLabel, 'problems-grid single-col', itemsHtml);
  }

  // 16. 反比例（x × y ＝ 決まった数）
  if (unit === 'g6_inv_prop') {
    const title = '反比例（x × y ＝ 決まった数）';
    const cand = [
      { k: 24, rowX: [1, 2, 3, 4], rowY: [24, 12, 8, 6] },
      { k: 18, rowX: [1, 2, 3, 6], rowY: [18, 9, 6, 3] },
      { k: 12, rowX: [1, 2, 3, 4], rowY: [12, 6, 4, 3] },
      { k: 20, rowX: [1, 2, 4, 5], rowY: [20, 10, 5, 4] },
      { k: 30, rowX: [1, 2, 3, 5], rowY: [30, 15, 10, 6] }
    ];
    const list = [{ k: 24, rowX: [1, 2, 3, 4], rowY: [24, 12, 8, 6], isRei: true }];
    const filteredCand = cand.filter(c => {
      const rei = list[0];
      const keys = Object.keys(rei).filter(k => k !== 'isRei');
      return !keys.every(k => JSON.stringify(c[k]) === JSON.stringify(rei[k]));
    });
    for (let i = 1; i <= 3; i++) {
      list.push({ ...filteredCand[(s * 2 + i) % filteredCand.length], isRei: false });
    }
    const itemsHtml = list.map((it, idx) => {
      const tracePart = it.isRei || level === 'step1';
      const showHint = it.isRei || level !== 'step3';
      return `
        <div class="problem-item" style="border-bottom:1px solid #e4e4e7; width:100%; padding:9px 0;">
          <div class="p-num">${it.isRei ? '<span class="rei-badge">れい</span>' : `(${idx})`}</div>
          <div style="display:flex; align-items:center; justify-content:space-between; width:100%;">
            <table class="grid-table" style="font-size:0.95rem;">
              <tr><th>x (たて)</th><td>1</td><td>2</td><td>3</td><td>4</td></tr>
              <tr><th>y (横)</th><td><span class="box xs">${cellVal(it.rowY[0], tracePart)}</span></td><td>${it.rowY[1]}</td><td>${it.rowY[2]}</td><td>${it.rowY[3]}</td></tr>
            </table>
            <div class="eq-row" style="font-size:1.05rem;">
              <span>x × y ＝</span>
              <span class="box sm">${cellVal(it.k, it.isRei)}</span>
            </div>
          </div>
          ${showHint ? `<div style="font-size:0.75rem; color:#71717a; text-align:right;">(積が常に一定)</div>` : ''}
        </div>
      `;
    }).join('');
    return wrapSheet(title, pageLabel, 'problems-grid single-col', itemsHtml);
  }

  // 17. 代表値（平均値・中央値・最頻値）
  if (unit === 'g6_data_represent') {
    const title = '代表値（平均値・中央値・最頻値）';
    const cand = [
      { data: [2, 3, 3, 5, 7], med: 3, mod: 3, avg: 4 },
      { data: [1, 2, 4, 4, 9], med: 4, mod: 4, avg: 4 },
      { data: [3, 4, 5, 5, 8], med: 5, mod: 5, avg: 5 },
      { data: [2, 5, 5, 6, 7], med: 5, mod: 5, avg: 5 },
      { data: [1, 3, 3, 6, 7], med: 3, mod: 3, avg: 4 },
      { data: [4, 5, 6, 6, 9], med: 6, mod: 6, avg: 6 }
    ];
    const list = [{ data: [2, 3, 3, 5, 7], med: 3, mod: 3, avg: 4, isRei: true }];
    const filteredCand = cand.filter(c => {
      const rei = list[0];
      const keys = Object.keys(rei).filter(k => k !== 'isRei');
      return !keys.every(k => JSON.stringify(c[k]) === JSON.stringify(rei[k]));
    });
    for (let i = 1; i <= 3; i++) {
      list.push({ ...filteredCand[(s * 2 + i) % filteredCand.length], isRei: false });
    }
    const itemsHtml = list.map((it, idx) => {
      const tracePart = it.isRei || level === 'step1';
      const showHint = it.isRei || level !== 'step3';
      return `
        <div class="problem-item" style="border:1px solid #e4e4e7; border-radius:6px; padding:10px 14px;">
          <div class="p-num">${it.isRei ? '<span class="rei-badge">れい</span>' : `(${idx})`}</div>
          <div style="width:100%;">
            <div style="font-weight:700; margin-bottom:4px;">データ：${it.data.join(', ')}</div>
            <div class="eq-row" style="justify-content:flex-end; font-size:1.05rem; gap:10px;">
              <div>中央値 (まんなか)：<span class="box sm">${cellVal(it.med, tracePart)}</span></div>
              <div>最頻値 (もっとも多い)：<span class="box sm">${cellVal(it.mod, it.isRei)}</span></div>
            </div>
            ${showHint ? `<div style="font-size:0.75rem; color:#71717a; text-align:right;">(小さい順に並べて確認)</div>` : ''}
          </div>
        </div>
      `;
    }).join('');
    return wrapSheet(title, pageLabel, 'problems-grid single-col', itemsHtml);
  }

  // 18. 柱状グラフ（ヒストグラム）
  if (unit === 'g6_data_histogram') {
    const title = '柱状グラフ（度数分布表と ヒストグラム）';
    const cand = [
      { range: '10m〜15m', count: 4, maxRange: '15m〜20m', maxCount: 8 },
      { range: '20m〜25m', count: 6, maxRange: '25m〜30m', maxCount: 9 },
      { range: '5m〜10m', count: 3, maxRange: '10m〜15m', maxCount: 7 },
      { range: '15m〜20m', count: 5, maxRange: '20m〜25m', maxCount: 10 },
      { range: '30m〜35m', count: 2, maxRange: '25m〜30m', maxCount: 8 },
      { range: '0m〜5m', count: 1, maxRange: '10m〜15m', maxCount: 6 },
      { range: '35m〜40m', count: 1, maxRange: '20m〜25m', maxCount: 11 }
    ];
    const list = [{ range: '10m〜15m', count: 4, maxRange: '15m〜20m', maxCount: 8, isRei: true }];
    const filteredCand = cand.filter(c => {
      const rei = list[0];
      const keys = Object.keys(rei).filter(k => k !== 'isRei');
      return !keys.every(k => JSON.stringify(c[k]) === JSON.stringify(rei[k]));
    });
    for (let i = 1; i <= 3; i++) {
      list.push({ ...filteredCand[(s * 2 + i) % filteredCand.length], isRei: false });
    }
    const itemsHtml = list.map((it, idx) => {
      const tracePart = it.isRei || level === 'step1';
      const showHint = it.isRei || level !== 'step3';
      return `
        <div class="problem-item" style="border-bottom:1px solid #e4e4e7; width:100%; padding:9px 0;">
          <div class="p-num">${it.isRei ? '<span class="rei-badge">れい</span>' : `(${idx})`}</div>
          <div style="display:flex; align-items:center; justify-content:space-between; width:100%;">
            <div>
              <div style="font-weight:700;">ボール投げ記録の 柱状グラフ</div>
              <div style="font-size:0.85rem; color:#52525b;">もっとも 人数が多い 階級は？</div>
            </div>
            <div class="eq-row" style="font-size:1.05rem;">
              <span class="box text" style="width:110px;">${cellVal(it.maxRange, tracePart)}</span>
              <span>(<span class="box xs">${cellVal(it.maxCount, it.isRei)}</span>人)</span>
            </div>
          </div>
          ${showHint ? `<div style="font-size:0.75rem; color:#71717a; text-align:right;">(いちばん高い柱をさがす)</div>` : ''}
        </div>
      `;
    }).join('');
    return wrapSheet(title, pageLabel, 'problems-grid single-col', itemsHtml);
  }

  // 19. 並べ方と 組み合わせ方
  if (unit === 'g6_comb_perm') {
    const title = '並べ方と 組み合わせ方（樹形図で 数える）';
    const cand = [
      { type: '4人から 2人選んで走る順 (並べ方)', ans: 12, part: '4 ×', hint: '4 × 3 ＝ 12通り' },
      { type: '4チームの 総当たり戦 (組み合わせ)', ans: 6, part: '3 ＋', hint: '3 ＋ 2 ＋ 1 ＝ 6通り' },
      { type: '3枚のカード (1,2,3) で作る2けた (並べ方)', ans: 6, part: '3 ×', hint: '3 × 2 ＝ 6通り' },
      { type: '5人から 2人の当番を選ぶ (組み合わせ)', ans: 10, part: '4 ＋', hint: '4＋3＋2＋1 ＝ 10通り' },
      { type: '4色のうち 2色選ぶ (組み合わせ)', ans: 6, part: '3 ＋', hint: '3＋2＋1 ＝ 6通り' }
    ];
    const list = [{ type: '4人から 2人選んで走る順 (並べ方)', ans: 12, part: '4 ×', hint: '4 × 3 ＝ 12通り', isRei: true }];
    const filteredCand = cand.filter(c => {
      const rei = list[0];
      const keys = Object.keys(rei).filter(k => k !== 'isRei');
      return !keys.every(k => JSON.stringify(c[k]) === JSON.stringify(rei[k]));
    });
    for (let i = 1; i <= 3; i++) {
      list.push({ ...filteredCand[(s * 2 + i) % filteredCand.length], isRei: false });
    }
    const itemsHtml = list.map((it, idx) => {
      const tracePart = it.isRei || level === 'step1';
      const showHint = it.isRei || level !== 'step3';
      return `
        <div class="problem-item" style="border-bottom:1px solid #e4e4e7; width:100%; padding:9px 0;">
          <div class="p-num">${it.isRei ? '<span class="rei-badge">れい</span>' : `(${idx})`}</div>
          <div style="display:flex; align-items:center; justify-content:space-between; width:100%;">
            <div>
              <div style="font-weight:700;">${it.type}</div>
              ${showHint ? `<div style="font-size:0.8rem; color:#52525b;">${it.hint}</div>` : ''}
            </div>
            <div class="eq-row" style="font-size:1.15rem;">
              <span>計算のあしがかり：<span class="box sm">${cellVal(it.part, tracePart)}</span></span>
              <span>ぜんぶで</span>
              <span class="box sm">${cellVal(it.ans, it.isRei)}</span>
              <span>通り</span>
            </div>
          </div>
        </div>
      `;
    }).join('');
    return wrapSheet(title, pageLabel, 'problems-grid single-col', itemsHtml);
  }

  return null;
}


function wrapSheet(title, pageLabel, gridClass, itemsHtml) {
      const stepLabels = {
        step1: "ステップ1（導入）",
        step2: "ステップ2（練習）",
        step3: "ステップ3（定着）"
      };
      const stepName = stepLabels[currentRenderingStep] || "";
      const stepBadgeHtml = stepName ? `<span class="sheet-step-badge">${stepName}</span>` : "";

      return `
        <section class="sheet">
          <div>
            <div class="sheet-header">
              <div class="sheet-title-wrap">
                <div class="sheet-title">${title}</div>
                ${stepBadgeHtml}
                <div class="sheet-page-num">${pageLabel}</div>
              </div>
              <div class="name-line">なまえ（　　　　　　　　　）</div>
            </div>
            <div class="${gridClass}">
              ${itemsHtml}
            </div>
          </div>
        </section>
      `;
    }

    function render() {
      const count = parseInt(document.getElementById('pageCount').value, 10);
      const container = document.getElementById('sheetsContainer');
      let html = '';
      if (state.level === 'all') {
        const steps = ['step1', 'step2', 'step3'];
        steps.forEach((st, sIdx) => {
          for (let p = 0; p < count; p++) {
            const pageLabel = count === 1 ? `（${sIdx + 1} / 3）` : (count > 1 ? `（${p + 1} / ${count}）` : '');
            html += buildSingleSheetHTML(state.unit, st, p, count, pageLabel);
          }
        });
      } else {
        for (let p = 0; p < count; p++) {
          html += buildSingleSheetHTML(state.unit, state.level, p, count);
        }
      }
      container.innerHTML = html;
    }

    initFromURL();
    renderSidebar();
    setStep(state.level);
  </script>
</body>
</html>
