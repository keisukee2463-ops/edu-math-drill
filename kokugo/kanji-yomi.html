<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>すっきりプリント かんじ よみ（1〜3年）</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      /* 画面全体はゴシック、学習する漢字のマスだけ教科書体（Klee One優先で全端末同じ見た目） */
      --font-ui: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
      --font-kyokasho: "Klee One", "UD Digi Kyokasho N-R", "YuKyokasho", "游教科書体", serif;
      --bg-app: #f6f5f2; --bg-panel: #ffffff; --bg-subtle: #efede8;
      --text-main: #1c1917; --text-sub: #57534e; --text-muted: #a8a29e;
      --border-soft: #e7e5e4; --border-mid: #d6d3d1;
      --accent: #2c5e4f; --accent-soft: #eaf2ef; --ink: #18181b; --ans-red: #c2410c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-ui);
      background: var(--bg-app); color: var(--text-main);
      display: flex; min-height: 100vh; -webkit-font-smoothing: antialiased;
    }

    /* ====== サイドバー（算数ページと同じ見た目） ====== */
    .sidebar { width: 300px; background: var(--bg-panel); border-right: 1px solid var(--border-soft);
      display: flex; flex-direction: column; position: fixed; top: 0; bottom: 0; left: 0; z-index: 40; overflow-y: auto; }
    .brand-box { padding: 20px 18px 16px; border-bottom: 1px solid var(--border-soft); }
    .subject-switch { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; }
    .subject-switch a { flex: 1 0 auto; text-align: center; text-decoration: none; font-size: 0.7rem; font-weight: 700;
      padding: 5px 6px; border-radius: 6px; color: var(--text-sub); background: var(--bg-subtle); }
    .subject-switch a.active { background: var(--text-main); color: #fff; }
    .brand-kicker { font-size: 0.68rem; color: var(--accent); font-weight: 700; letter-spacing: 0.08em; margin-bottom: 4px; }
    .brand-main { font-size: 1.02rem; font-weight: 800; letter-spacing: 0.02em; line-height: 1.35; }
    .brand-count { font-size: 0.72rem; color: var(--text-sub); margin-top: 4px; font-weight: 600; }
    .brand-note { font-size: 0.68rem; color: var(--text-sub); line-height: 1.55; margin-top: 10px; padding: 8px 10px;
      background: #fafaf9; border: 1px solid var(--border-soft); border-radius: 6px; }
    .brand-note p + p { margin-top: 4px; }
    .grade-filter { display: flex; flex-wrap: wrap; gap: 4px; padding: 10px 14px; border-bottom: 1px solid var(--border-soft); background: #fafaf9; position: sticky; top: 0; z-index: 5; }
    .grade-chip { border: 1px solid transparent; background: transparent; color: var(--text-sub); font-size: 0.72rem; font-weight: 700; padding: 4px 6px; border-radius: 6px; cursor: pointer; transition: all 0.15s; white-space: nowrap; flex: 1 0 auto; text-align: center; }
    .grade-chip:hover { background: var(--bg-subtle); }
    .grade-chip.active { background: var(--text-main); color: #fff; }
    .unit-list { padding: 14px 12px 32px; display: flex; flex-direction: column; gap: 18px; flex: 1; }
    .cat-group-title { font-size: 0.72rem; font-weight: 700; color: var(--accent); letter-spacing: 0.05em;
      margin-bottom: 6px; padding-left: 6px; border-left: 3px solid var(--accent); }
    .unit-btn { width: 100%; text-align: left; background: transparent; border: 1px solid transparent; border-radius: 7px;
      padding: 7px 9px; margin-bottom: 2px; cursor: pointer; display: flex; align-items: flex-start; gap: 7px; font-family: inherit; }
    .unit-btn:hover { background: #fafaf9; border-color: var(--border-soft); }
    .unit-btn.active { background: var(--accent-soft); border-color: #b7d4cb; }
    .unit-grade-tag { font-size: 0.64rem; font-weight: 700; padding: 2px 5px; border-radius: 4px;
      background: var(--bg-subtle); color: var(--text-sub); white-space: nowrap; margin-top: 1px; }
    .unit-btn.active .unit-grade-tag { background: var(--accent); color: #fff; }
    .unit-name { font-size: 0.8rem; font-weight: 700; line-height: 1.35; }
    .coming { font-size: 0.72rem; color: var(--text-muted); padding: 4px 8px; }

    /* ====== メイン・ツールバー ====== */
    .main-area { margin-left: 300px; flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .top-toolbar { background: rgba(255,255,255,0.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border-soft);
      padding: 12px 28px; position: sticky; top: 0; z-index: 30; }
    .toolbar-inner { max-width: 940px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center;
      justify-content: space-between; gap: 12px; }
    .step-pills { display: inline-flex; background: var(--bg-subtle); padding: 3px; border-radius: 8px; gap: 2px; }
    .step-pill { border: none; background: transparent; padding: 6px 13px; border-radius: 6px; font-size: 0.8rem;
      font-weight: 700; color: var(--text-sub); cursor: pointer; font-family: inherit; }
    .step-pill.active { background: #fff; color: var(--text-main); box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
    .mobile-unit-bar, .drawer-close, .drawer-backdrop { display: none; }
    .toolbar-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .btn { padding: 7px 13px; border-radius: 7px; border: 1px solid var(--border-mid); background: #fff; color: var(--text-main);
      font-weight: 700; font-size: 0.81rem; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-family: inherit; }
    .btn:hover { background: #fafaf9; border-color: #a8a29e; }
    .btn.on { background: var(--accent-soft); border-color: #b7d4cb; color: var(--accent); }
    .btn-print { background: var(--accent); color: #fff; border-color: var(--accent); padding: 7px 16px; }
    .btn-print:hover { background: #234b3f; border-color: #234b3f; }
    .btn-all-print { background: #0f766e; color: #fff; border-color: #0f766e; padding: 7px 16px; }
    .btn-all-print:hover { background: #115e59; border-color: #115e59; }
    .toast { position: fixed; bottom: 24px; right: 24px; background: var(--text-main); color: #fff; padding: 10px 16px;
      border-radius: 8px; font-size: 0.82rem; font-weight: 600; display: none; z-index: 100; }
    .preview-workspace { padding: 28px 24px 64px; flex: 1; }
    #sheetsContainer { display: flex; flex-direction: column; gap: 32px; }

    /* ====== A4 プリント紙面 ====== */
    .sheet { width: 210mm; min-height: 280mm; margin: 0 auto; background: #fff; padding: 11mm 13mm;
      box-shadow: 0 2px 12px rgba(28,25,23,0.06), 0 0 1px rgba(28,25,23,0.12); display: flex; flex-direction: column; }
    .sheet-header { display: flex; justify-content: space-between; align-items: flex-end;
      border-bottom: 1.5px solid var(--ink); padding-bottom: 6px; margin-bottom: 8px; }
    .sheet-title-wrap { display: flex; align-items: baseline; gap: 10px; }
    .sheet-title { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.05em; }
    .sheet-step-badge { font-size: 0.74rem; font-weight: 700; padding: 2px 8px; border-radius: 4px; background: #f4f4f5;
      border: 1px solid #71717a; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .sheet-page-num { font-size: 0.8rem; color: #71717a; font-weight: 600; }
    .name-line { font-size: 0.94rem; border-bottom: 1px solid var(--ink); width: 195px; padding-bottom: 3px; letter-spacing: 0.05em; }
    .guide { font-size: 0.8rem; color: var(--text-sub); margin-bottom: 8px; }

    /* 今日の漢字 */
    .kanji-strip { display: flex; gap: 8px; margin-bottom: 8px; }
    .kbox { flex: 1; border: 1px solid var(--border-soft); border-radius: 6px; text-align: center; padding: 4px 2px 4px; background: #fafaf9; }
    .kbox .kk { font-size: 1.7rem; line-height: 1.05; font-weight: 700; color: var(--text-main); }
    .kbox .kr { font-size: 0.66rem; color: var(--text-sub); line-height: 1.3; min-height: 1.3em; }

    /* 行（問題＋こたえ欄）*/
    .rows { display: block; }
    .row { display: grid; grid-template-columns: 1fr 36mm; align-items: center; }
    .no-fold .row { grid-template-columns: 1fr; }
    .no-fold .ans-cell { display: none; }
    .ans-cell { border-left: 1px dashed var(--border-mid); padding: 0 0 0 3.5mm; font-size: 0.82rem; color: var(--ink); align-self: stretch;
      display: flex; align-items: center; line-height: 1.3; }
    .ans-cell.head { font-size: 0.68rem; color: #71717a; align-items: flex-end; }
    .sec-title { font-size: 0.88rem; font-weight: 700; padding: 6px 0 3px; margin-top: 4px; }
    .sec-title span { font-size: 0.74rem; font-weight: 600; color: var(--text-sub); margin-left: 6px; }
    .item { display: flex; align-items: center; gap: 10px; padding: 2.5mm 3mm 2.5mm 0; min-height: 15.5mm; }
    .item.is-rei { background: #fafaf9; border-radius: 6px; padding: 2mm 3.5mm; margin-bottom: 2mm; border: 1px solid var(--border-soft); }
    .item .no { width: 1.8em; font-size: 0.9rem; font-weight: 700; color: var(--ink); text-align: right; flex-shrink: 0; }
    .item .txt { font-size: 1.6rem; line-height: 1.7; color: var(--ink); width: 46mm; flex-shrink: 0; letter-spacing: 0.06em; }
    .item.sent .txt { font-size: 1.22rem; width: auto; flex: 1; letter-spacing: 0.02em; }
    .item .arrow { color: #a1a1aa; font-size: 0.85rem; flex-shrink: 0; }
    /* 読みを書くマス（1マス1文字） */
    .cells { display: flex; flex-shrink: 0; }
    .cell { width: 11mm; height: 11mm; border: 1.2px solid #71717a; margin-left: -1.2px; display: flex; align-items: center;
      justify-content: center; font-size: 1.35rem; color: #a1a1aa; background: #fff; border-radius: 2px; }
    .cell:first-child { margin-left: 0; }
    .freebox { height: 11mm; border: 1.2px solid #71717a; flex-shrink: 0; background: #fff; border-radius: 2px; }
    .item.sent .cell { width: 10mm; height: 10mm; font-size: 1.25rem; }
    .item.sent .freebox { height: 10mm; }
    .rei-badge { border: 1.2px solid var(--ink); border-radius: 4px; padding: 1px 7px; font-size: 0.72rem; font-weight: 700; flex-shrink: 0; letter-spacing: 0.04em; }
    ruby rt { font-size: 0.5em; letter-spacing: 0; color: var(--ink); }
    ruby rt.hide { visibility: hidden; }
    .tg { text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 5px; }
    .foot { margin-top: auto; padding-top: 6px; font-size: 0.72rem; color: #71717a; display: flex; justify-content: space-between; }

    @media (max-width: 820px) {
      .sidebar { transform: translateX(-100%); transition: transform 0.2s; width: min(86vw, 320px); z-index: 60; }
      body.drawer-open .sidebar { transform: translateX(0); }
      .drawer-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 55; }
      body.drawer-open .drawer-backdrop { display: block; }
      .drawer-close { display: block; position: absolute; top: 10px; right: 10px; width: 36px; height: 36px;
        border: 1px solid var(--border-mid); border-radius: 8px; background: #fff; font-size: 1.2rem; cursor: pointer; z-index: 6; }
      .brand-box { padding: 14px 52px 12px 16px; }
      .main-area { margin-left: 0; width: 100%; max-width: 100vw; }
      .top-toolbar { position: static; padding: 10px 10px 8px; }
      .toolbar-inner { flex-direction: column; align-items: stretch; gap: 8px; }
      .mobile-unit-bar { display: flex; align-items: center; gap: 10px; }
      .btn-menu { flex-shrink: 0; background: var(--accent); color: #fff; border-color: var(--accent); }
      .current-unit-name { font-size: 0.86rem; font-weight: 800; line-height: 1.35; }
      .pill-sub { display: none; }
      .step-pills { display: flex; }
      .step-pill { flex: 1; padding: 6px 4px; font-size: 0.76rem; white-space: nowrap; }
      .toolbar-actions { flex-wrap: nowrap; overflow-x: auto; gap: 6px; padding-bottom: 2px; }
      .toolbar-actions > * { flex-shrink: 0; white-space: nowrap; }
      .btn { padding: 6px 10px; font-size: 0.76rem; }
      .toast { left: 16px; right: 16px; bottom: 16px; text-align: center; }
      .preview-workspace { padding: 12px 0 48px; overflow-x: hidden; text-align: center; }
      .sheet { zoom: 0.42; display: inline-block; text-align: left; margin: 0; vertical-align: top; }
    }

    @media print {
      @page { size: A4 portrait; margin: 8mm 12mm; }
      html, body { background: #fff !important; display: block !important; height: auto !important; min-height: 0 !important; }
      .no-print { display: none !important; }
      .main-area { margin-left: 0 !important; display: block !important; }
      .preview-workspace { padding: 0 !important; }
      #sheetsContainer { display: block !important; gap: 0 !important; }
      .sheet { zoom: 1 !important; width: 100% !important; min-height: 0 !important; height: auto !important; box-shadow: none !important;
        padding: 2mm 2mm 0 2mm !important; margin: 0 !important; page-break-inside: avoid; break-inside: avoid; }
      .sheet:not(:last-child) { page-break-after: always; break-after: page; }
    }

    /* ===== 学習用フォント（教科書体）の適用先 ===== */
    .kbox .kk, .tg { font-family: var(--font-kyokasho); font-weight: 600; }
  </style>
</head>
<body>

  <aside class="sidebar no-print" id="sidebar">
    <button class="drawer-close" onclick="closeDrawer()" aria-label="閉じる">×</button>
    <div class="brand-box">
      <div class="subject-switch">
        <a href="../index.html">算数</a>

  <div class="main-area">
    <header class="top-toolbar no-print">
      <div class="toolbar-inner">
        <div class="mobile-unit-bar">
          <button class="btn btn-menu" onclick="openDrawer()" aria-label="教材を選ぶ">☰ 教材</button>
          <div class="current-unit-name" id="currentUnitName"></div>
        </div>
        <div class="step-pills">
          <button class="step-pill active" id="pill-step1" onclick="setStep('step1')">ステップ1<span class="pill-sub">（なぞって書く）</span></button>
          <button class="step-pill" id="pill-step2" onclick="setStep('step2')">ステップ2<span class="pill-sub">（はじめの1字ヒント）</span></button>
          <button class="step-pill" id="pill-step3" onclick="setStep('step3')">ステップ3<span class="pill-sub">（じぶんで書く）</span></button>
          <button class="step-pill" id="pill-all" onclick="setStep('all')">全ステップ<span class="pill-sub">（1〜3一括）</span></button>
        </div>
        <div class="toolbar-actions">
          <button class="btn" onclick="shuffleItems()">もんだいを入れかえる</button>
          <button class="btn on" id="btnFold" onclick="toggleFold()">こたえ欄（折って隠す）</button>
          <button class="btn" onclick="copyUnitLink()" title="この単元のURLをコピー">URLコピー</button>
          <button class="btn btn-all-print" onclick="printAll()" title="ステップ1・2・3をまとめて印刷">単元一括印刷（1〜3）</button>

  <script src="kanji1-data.js"></script>
  <script src="kanji2-data.js"></script>
  <script src="kanji3-data.js"></script>
  <script src="kanji4-data.js"></script>
  <script src="kanji5-data.js"></script>
  <script src="kanji6-data.js"></script>
  <script>
    const ALL_UNITS = [...KANJI_UNITS_G1, ...KANJI_UNITS_G2, ...KANJI_UNITS, ...KANJI_UNITS_G4, ...KANJI_UNITS_G5, ...KANJI_UNITS_G6];
    const STEP_INFO = {
      step1: { badge: "ステップ1", sub: "なぞって書く", guide: "こえに だして よみながら、マスの うすい じを なぞろう。おわったら みぎを ひらいて こたえあわせ。" },
      step2: { badge: "ステップ2", sub: "はじめの1字ヒント", guide: "はじめの 1じだけ ヒントが あるよ。のこりの よみを マスに かこう。" },
      step3: { badge: "ステップ3", sub: "じぶんで書く", guide: "よみを ひらがなで □に かこう。おわったら みぎを ひらいて こたえあわせ。" }
    };
    let state = { unit: ALL_UNITS[0].id, gradeFilter: "all", level: "step1", seed: 1, fold: true };

    /* ---------- 表記のパース ---------- */
    function parse(str) {
      const nodes = [], re = /\{([^|}]+)\|([^|}]+)(?:\|(!))?\}/g;
      let last = 0, m;
      while ((m = re.exec(str)) !== null) {
        if (m.index > last) nodes.push({ t: "x", text: str.slice(last, m.index) });
        nodes.push({ t: "r", k: m[1], r: m[2], always: !!m[3] });
        last = re.lastIndex;
      }
      if (last < str.length) nodes.push({ t: "x", text: str.slice(last) });
      return nodes;
    }
    function readingOf(str) { return parse(str).map(n => n.t === "r" ? n.r : n.text).join("").replace(/\s/g, ""); }
    function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

    /* ふりがなを出すか: step1=全部 / step2,3=「!」付きだけ。非表示でも場所は確保（行の高さを揃える） */
    function renderText(str, level, unitKanji, underline) {
      const nodes = parse(str);
      let html = "", i = 0;
      while (i < nodes.length) {
        if (nodes[i].t === "x") { html += esc(nodes[i].text); i++; continue; }
        let j = i, run = "", isTarget = false, end = i;
        while (end < nodes.length && nodes[end].t === "r") end++;
        const groupT = nodes.slice(i, end).some(n => [...n.k].some(c => unitKanji.includes(c)));
        while (j < nodes.length && nodes[j].t === "r") {
          const n = nodes[j];
          const isT = [...n.k].some(c => unitKanji.includes(c));
          const show = n.always || (underline && !groupT);
          run += `<ruby>${esc(n.k)}<rt class="${show ? "" : "hide"}">${esc(n.r)}</rt></ruby>`;
          if ([...n.k].some(c => unitKanji.includes(c))) isTarget = true;
          j++;
        }
        html += (underline && isTarget) ? `<span class="tg">${run}</span>` : run;
        i = j;
      }
      return html;
    }
    /* 文の中の「新出漢字をふくむ語」のこたえ（例: 医者→いしゃ） */
    function targetAnswers(str, unitKanji) {
      const nodes = parse(str), out = [];
      let i = 0;
      while (i < nodes.length) {
        if (nodes[i].t !== "r") { i++; continue; }
        let j = i, k = "", r = "", isTarget = false;
        while (j < nodes.length && nodes[j].t === "r") {
          k += nodes[j].k; r += nodes[j].r;
          if ([...nodes[j].k].some(c => unitKanji.includes(c))) isTarget = true;
          j++;
        }
        if (isTarget) out.push({ k, r });
        i = j;
      }
      return out;
    }

    /* ---------- 乱数（シード固定で入れかえ） ---------- */
    function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
    function shuffled(arr, seed) {
      if (seed <= 1) return arr.slice();
      const rnd = mulberry(seed), a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
      return a;
    }

    /* ---------- シート組み立て ---------- */
    function getUnit(id) { return ALL_UNITS.find(u => u.id === id) || ALL_UNITS[0]; }
    /* 読みを書くマス: step1=全部なぞり / step2=1字目だけなぞり / step3=マス目なしの□ / isRei=手本 */
    function cellsHTML(reading, level, isRei = false) {
      const ch = [...reading];
      if (isRei) {
        return `<div class="cells">` + ch.map(c => `<div class="cell" style="color:#52525b; font-weight:700;">${esc(c)}</div>`).join("") + `</div>`;
      }
      if (level === "step3") return `<div class="freebox" style="width:${Math.max(ch.length + 1, 4) * 11}mm"></div>`;
      return `<div class="cells">` + ch.map((c, i) => {
        const t = level === "step1" || i === 0 ? esc(c) : "";
        return `<div class="cell">${t}</div>`;
      }).join("") + `</div>`;
    }
    function circled(n) { return "①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳㉑㉒㉓㉔㉕㉖㉗㉘㉙㉚㉛㉜㉝㉞㉟㊱㊲㊳㊴㊵㊶㊷㊸㊹㊺㊻㊼㊽㊾㊿"[n - 1] || String(n); }

    function buildSheet(unitId, level, pageLabel) {
      const u = getUnit(unitId), info = STEP_INFO[level];
      const uk = u.kanji.map(x => x.k).join("");

      // 各漢字から代表熟語を1つずつ選出（合計5語前後）し、シャッフル
      const wordCand = [];
      u.kanji.forEach((x, kIdx) => {
        if (x.words && x.words.length > 0) {
          const wIdx = (state.seed + kIdx) % x.words.length;
          wordCand.push(x.words[wIdx]);
        }
      });
      const W = shuffled(wordCand, state.seed);
      // 1問目を「れい」とし、残りを通常問題にする
      const reiWord = W[0];
      const normalWords = W.slice(1);

      // 短文は3問に絞り込み
      const S = shuffled(u.kanji.map(x => x.sent), state.seed * 7).slice(0, 3);

      const strip = u.kanji.map(x => {
        const kr = level === "step1" ? `${esc(x.on)}${x.kun ? "<br>" + esc(x.kun) : ""}` : "";
        return `<div class="kbox"><div class="kk">${esc(x.k)}</div><div class="kr">${kr}</div></div>`;
      }).join("");

      let n = 0, rows = "";
      rows += `<div class="row"><div class="sec-title">1 じゅくごの よみを かこう<span>（れい＋${normalWords.length}もん）</span></div><div class="ans-cell head">こたえ ←ここで おる</div></div>`;

      // れい（例題）
      if (reiWord) {
        const r = readingOf(reiWord.w);
        rows += `<div class="row"><div class="item is-rei"><span class="rei-badge">れい</span><span class="txt">${renderText(reiWord.w, "step1", uk, false)}</span>` +
                `<span class="arrow">▶</span>${cellsHTML(r, level, true)}</div><div class="ans-cell"><span style="color:#71717a; font-weight:600;">（れい）</span></div></div>`;
      }

      // 通常の熟語問題
      normalWords.forEach(w => {
        n++;
        const r = readingOf(w.w);
        rows += `<div class="row"><div class="item"><span class="no">(${n})</span><span class="txt">${renderText(w.w, level, uk, false)}</span>` +
                `<span class="arrow">▶</span>${cellsHTML(r, level, false)}</div><div class="ans-cell">${esc(r)}</div></div>`;
      });

      // 短文問題
      rows += `<div class="row"><div class="sec-title" style="margin-top:10px;">2 ぶんの なかで よもう<span>（${S.length}もん・せんの ことばの よみを マスに かこう）</span></div><div class="ans-cell"></div></div>`;
      S.forEach(s => {
        n++;
        const ts = targetAnswers(s, uk);
        rows += `<div class="row"><div class="item sent"><span class="no">(${n})</span><span class="txt">${renderText(s, level, uk, true)}</span>` +
                `<span class="arrow">▶</span>${ts.map(t => cellsHTML(t.r, level, false)).join("")}</div>` +
                `<div class="ans-cell">${ts.map(t => esc(t.k + "→" + t.r)).join("、")}</div></div>`;
      });

      return `<section class="sheet ${state.fold ? "" : "no-fold"}">
        <div class="sheet-header">
          <div class="sheet-title-wrap">
            <div class="sheet-title">かんじ よみ ${circled(u.no)}</div>
            <span class="sheet-step-badge">${info.badge}（${info.sub}）</span>
            <span class="sheet-page-num">${pageLabel || ""}</span>
          </div>
          <div class="name-line">なまえ</div>
        </div>
        <div class="guide">${info.guide}</div>
        <div class="kanji-strip">${strip}</div>
        <div class="rows">${rows}</div>
        <div class="foot"><span>すっきりプリント かんじ よみ</span><span>かんじ よみ ${circled(u.no)}</span></div>
      </section>`;
    }

    function render() {
      const c = document.getElementById("sheetsContainer");
      let html = "";
      if (state.level === "all") ["step1", "step2", "step3"].forEach((st, i) => { html += buildSheet(state.unit, st, `（${i + 1} / 3）`); });
      else html = buildSheet(state.unit, state.level, "");
      c.innerHTML = html;
      const u = getUnit(state.unit);
      document.getElementById("currentUnitName").textContent = unitLabel(u);
      const stepMap = { step1: "ステップ1", step2: "ステップ2", step3: "ステップ3", all: "単元一括（ステップ1〜3）" };
      const stepLabel = stepMap[state.level] || state.level;
      const kanjiChars = u.kanji ? u.kanji.map(x => x.k).join("") : "";
      document.title = `【${u.grade}年】かんじ よみ ${circled(u.no)}（${kanjiChars}）_${stepLabel}`;
      adjustMobileFit();
    }

    /* ---------- UI ---------- */
    function unitLabel(u) { return `${u.grade}年 ${circled(u.no)} ${u.kanji.map(x => x.k).join("")}`; }
    const GRADE_CONFIG = [
      { grade: "1", title: "1年生・配当漢字（全80字・16単元）", list: KANJI_UNITS_G1, kanjiCount: 80 },
      { grade: "2", title: "2年生・配当漢字（全160字・32単元）", list: KANJI_UNITS_G2, kanjiCount: 160 },
      { grade: "3", title: "3年生・配当漢字（全200字・40単元）", list: KANJI_UNITS, kanjiCount: 200 },
      { grade: "4", title: "4年生・配当漢字（全202字・41単元）", list: KANJI_UNITS_G4, kanjiCount: 202 },
      { grade: "5", title: "5年生・配当漢字（全193字・39単元）", list: KANJI_UNITS_G5, kanjiCount: 193 },
      { grade: "6", title: "6年生・配当漢字（全191字・38単元）", list: KANJI_UNITS_G6, kanjiCount: 191 }
    ];

    function renderSidebar() {
      const totalKanji = ALL_UNITS.reduce((a, u) => a + u.kanji.length, 0);
      const curConfig = GRADE_CONFIG.find(c => c.grade === state.gradeFilter);
      document.getElementById("unitCountLabel").textContent =
        state.gradeFilter === "all"
          ? `小1〜6年 配当漢字 全${totalKanji}字（全${ALL_UNITS.length}単元）を公開中`
          : `${curConfig.grade}年生：配当漢字 ${curConfig.kanjiCount}字（全${curConfig.list.length}単元）`;

      let html = "";
      GRADE_CONFIG.forEach(cfg => {
        if (state.gradeFilter === "all" || state.gradeFilter === cfg.grade) {
          html += `<div><div class="cat-group-title">${cfg.title}</div>`;
          cfg.list.forEach(u => {
            html += `<button class="unit-btn ${u.id === state.unit ? "active" : ""}" onclick="selectUnit('${u.id}')">` +
                    `<span class="unit-grade-tag">${u.grade}年</span><span class="unit-name">${circled(u.no)} ${u.kanji.map(x => x.k).join(" ")}</span></button>`;
          });
          html += `</div>`;
        }
      });
      document.getElementById("unitListContainer").innerHTML = html;
    }

    function filterGrade(grade, btn) {
      state.gradeFilter = grade;
      document.querySelectorAll(".grade-chip").forEach(el => el.classList.remove("active"));
      if (btn) btn.classList.add("active");
      updateURL();
      renderSidebar();
    }

    function selectUnit(id) { state.unit = id; state.seed = 1; renderSidebar(); updateURL(); render(); closeDrawer(); window.scrollTo(0, 0); }
    function setStep(s) {
      state.level = s;
      ["step1", "step2", "step3", "all"].forEach(x => document.getElementById("pill-" + x).classList.toggle("active", x === s));
      updateURL(); render();
    }
    function shuffleItems() { state.seed = Math.floor(Math.random() * 100000) + 2; render(); }
    function toggleFold() { state.fold = !state.fold; document.getElementById("btnFold").classList.toggle("on", state.fold); render(); }
    function printAll() {
      const prev = state.level;
      state.level = "all";
      render();
      window.print();
      setTimeout(() => {
        state.level = prev;
        render();
      }, 500);
    }
    function openDrawer() { document.body.classList.add("drawer-open"); }
    function closeDrawer() { document.body.classList.remove("drawer-open"); }
    function showToast(msg) { const t = document.getElementById("toastBox"); t.textContent = msg; t.style.display = "block"; setTimeout(() => t.style.display = "none", 1800); }
    function updateURL() {
      const url = new URL(location.href);
      url.searchParams.set("unit", state.unit);
      url.searchParams.set("step", state.level);
      if (state.gradeFilter !== "all") url.searchParams.set("grade", state.gradeFilter);
      else url.searchParams.delete("grade");
      history.replaceState({}, "", url);
    }
    function copyUnitLink() {
      updateURL();
      (navigator.clipboard ? navigator.clipboard.writeText(location.href) : Promise.reject()).then(() => showToast("URLをコピーしました"), () => showToast("コピーできませんでした"));
    }
    function initFromURL() {
      const p = new URLSearchParams(location.search);
      const u = p.get("unit"), s = p.get("step"), g = p.get("grade");
      if (g && ["all", "1", "2", "3", "4", "5", "6"].includes(g)) {
        state.gradeFilter = g;
        document.querySelectorAll(".grade-chip").forEach(el => el.classList.remove("active"));
        const chip = document.getElementById("chip-" + g);
        if (chip) chip.classList.add("active");
      }
      if (u && ALL_UNITS.some(x => x.id === u)) {
        state.unit = u;
      }
      if (s && ["step1", "step2", "step3", "all"].includes(s)) state.level = s;
    }


    function adjustMobileFit() {
      if (window.innerWidth <= 860) {
        const ws = document.querySelector('.preview-workspace');
        if (!ws) return;
        const availableWidth = ws.clientWidth - 12;
        // 210mm (標準96dpi換算で約794px)
        const scale = Math.min(0.44, (availableWidth - 16) / 810);
        document.querySelectorAll('.sheet').forEach(s => {
          s.style.zoom = scale;
        });
      } else {
        document.querySelectorAll('.sheet').forEach(s => {
          s.style.zoom = '';
        });
      }
    }
    window.addEventListener('resize', adjustMobileFit);

    initFromURL();
    renderSidebar();
    setStep(state.level);
  </script>
</body>
</html>
